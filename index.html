<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="Istanbul Navigator - Offline map, routes and travel companion for Istanbul, Turkey" />
    <!-- FIX: removed <link rel="manifest"> pointing at a non-existent
         manifest.json that referenced pwa-192x192.png, which caused:
           404 on the manifest file itself, AND
           "Download error or resource isn't a valid image" for the icon.
         If you add a real PWA manifest later, put it back here. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Istanbul Navigator</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { background: #050506; font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
      .leaflet-container { height: 100%; width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
