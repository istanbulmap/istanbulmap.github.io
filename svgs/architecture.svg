<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050506"/>
      <stop offset="100%" style="stop-color:#0b0c10"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(233,228,218,0.3)"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f4ef1"/>
    </marker>
    <clipPath id="rc"><rect width="1200" height="420" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rc)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" rx="14" fill="none" stroke="rgba(233,228,218,0.08)" stroke-width="1"/>

    <!-- Title -->
    <text x="40" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b" letter-spacing="0.2em">ARCHITECTURE</text>

    <!-- ── LAYER 1: User / Browser ── -->
    <text x="40" y="72" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.15em">USER LAYER</text>

    <!-- App.tsx -->
    <rect x="40" y="82" width="160" height="54" rx="10" fill="rgba(79,78,241,0.1)" stroke="rgba(79,78,241,0.35)" stroke-width="1"/>
    <text x="120" y="107" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#e9e4da">App.tsx</text>
    <text x="120" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b">Root orchestrator</text>

    <!-- useAppStore -->
    <rect x="220" y="82" width="160" height="54" rx="10" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="300" y="107" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#e9e4da">useAppStore</text>
    <text x="300" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b">Global state hook</text>

    <!-- MapView class -->
    <rect x="400" y="82" width="160" height="54" rx="10" fill="rgba(45,212,191,0.08)" stroke="rgba(45,212,191,0.3)" stroke-width="1"/>
    <text x="480" y="107" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#e9e4da">MapView</text>
    <text x="480" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b">Leaflet OOP class</text>

    <!-- Arrows row 1 -->
    <line x1="200" y1="109" x2="218" y2="109" stroke="rgba(233,228,218,0.25)" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="109" x2="398" y2="109" stroke="rgba(233,228,218,0.25)" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ── LAYER 2: Panels ── -->
    <text x="40" y="168" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.15em">PANEL LAYER</text>

    <!-- Panel boxes -->
    <g>
      <rect x="40" y="178" width="112" height="44" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
      <text x="96" y="197" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">RoutePanel</text>
      <text x="96" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4f4ef1">+ PlaceSearch</text>
    </g>
    <g>
      <rect x="164" y="178" width="112" height="44" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
      <text x="220" y="197" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">PinsPanel</text>
      <text x="220" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#f43f5e">CRUD + drag</text>
    </g>
    <g>
      <rect x="288" y="178" width="112" height="44" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
      <text x="344" y="197" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">FavoritesPanel</text>
      <text x="344" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#f59e0b">7 categories</text>
    </g>
    <g>
      <rect x="412" y="178" width="112" height="44" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
      <text x="468" y="197" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">NotesPanel</text>
      <text x="468" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b5cf6">geo-anchored</text>
    </g>
    <g>
      <rect x="536" y="178" width="112" height="44" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
      <text x="592" y="197" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">SettingsPanel</text>
      <text x="592" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#2dd4bf">import / export</text>
    </g>

    <!-- ── LAYER 3: Utils ── -->
    <text x="40" y="256" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.15em">UTILITY LAYER</text>

    <g>
      <rect x="40" y="266" width="148" height="44" rx="8" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
      <text x="114" y="285" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">routing.ts</text>
      <text x="114" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#f59e0b">duration / steps calc</text>
    </g>
    <g>
      <rect x="200" y="266" width="148" height="44" rx="8" fill="rgba(45,212,191,0.07)" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
      <text x="274" y="285" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">storage.ts</text>
      <text x="274" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#2dd4bf">JSON export / import</text>
    </g>
    <g>
      <rect x="360" y="266" width="148" height="44" rx="8" fill="rgba(139,92,246,0.07)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
      <text x="434" y="285" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">geocoder.ts</text>
      <text x="434" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b5cf6">Nominatim search</text>
    </g>
    <g>
      <rect x="520" y="266" width="148" height="44" rx="8" fill="rgba(79,78,241,0.07)" stroke="rgba(79,78,241,0.25)" stroke-width="1"/>
      <text x="594" y="285" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">transitWaypoints.ts</text>
      <text x="594" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4f4ef1">station node database</text>
    </g>

    <!-- ── LAYER 4: External APIs ── -->
    <text x="40" y="344" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.15em">EXTERNAL SERVICES (FREE · NO API KEY)</text>

    <g>
      <rect x="40" y="354" width="180" height="44" rx="8" fill="rgba(116,184,44,0.07)" stroke="rgba(116,184,44,0.25)" stroke-width="1"/>
      <text x="130" y="373" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">OpenStreetMap Tiles</text>
      <text x="130" y="388" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#74b82c">tile.openstreetmap.org</text>
    </g>
    <g>
      <rect x="232" y="354" width="180" height="44" rx="8" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
      <text x="322" y="373" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">OSRM Router</text>
      <text x="322" y="388" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#f59e0b">router.project-osrm.org</text>
    </g>
    <g>
      <rect x="424" y="354" width="180" height="44" rx="8" fill="rgba(139,92,246,0.07)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
      <text x="514" y="373" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#e9e4da">Nominatim Geocoder</text>
      <text x="514" y="388" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b5cf6">nominatim.openstreetmap.org</text>
    </g>

    <!-- ── Right side: Data flow ── -->
    <text x="780" y="72" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.15em">DATA FLOW</text>

    <!-- Data flow boxes -->
    <rect x="780" y="82" width="380" height="316" rx="12" fill="rgba(233,228,218,0.02)" stroke="rgba(233,228,218,0.08)" stroke-width="1"/>

    <!-- User action -->
    <rect x="900" y="106" width="140" height="36" rx="8" fill="rgba(233,228,218,0.07)" stroke="rgba(233,228,218,0.18)" stroke-width="1"/>
    <text x="970" y="129" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" fill="#e9e4da">User Action</text>

    <!-- Arrow down -->
    <line x1="970" y1="142" x2="970" y2="168" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

    <!-- useAppStore -->
    <rect x="880" y="170" width="180" height="36" rx="8" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="970" y="193" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" fill="#e9e4da">useAppStore (state)</text>

    <!-- Arrow down -->
    <line x1="970" y1="206" x2="970" y2="232" stroke="#4f4ef1" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>

    <!-- React re-render -->
    <rect x="880" y="234" width="180" height="36" rx="8" fill="rgba(97,218,251,0.08)" stroke="rgba(97,218,251,0.25)" stroke-width="1"/>
    <text x="970" y="257" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" fill="#61dafb">React re-render</text>

    <!-- Arrow splits -->
    <line x1="970" y1="270" x2="970" y2="292" stroke="rgba(233,228,218,0.3)" stroke-width="1.5"/>
    <line x1="860" y1="292" x2="1080" y2="292" stroke="rgba(233,228,218,0.2)" stroke-width="1"/>
    <line x1="860" y1="292" x2="860" y2="312" stroke="rgba(233,228,218,0.3)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="1080" y1="292" x2="1080" y2="312" stroke="rgba(233,228,218,0.3)" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Panel update -->
    <rect x="800" y="314" width="116" height="36" rx="8" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
    <text x="858" y="337" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#9a9d95">Panel update</text>

    <!-- Map update -->
    <rect x="1018" y="314" width="116" height="36" rx="8" fill="rgba(45,212,191,0.07)" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
    <text x="1076" y="337" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#2dd4bf">Map update</text>

    <!-- sessionStorage note -->
    <rect x="800" y="362" width="334" height="26" rx="6" fill="rgba(233,228,218,0.03)" stroke="rgba(233,228,218,0.07)" stroke-width="1"/>
    <text x="967" y="379" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#2b3038" letter-spacing="0.05em">State persisted to sessionStorage on every mutation</text>
  </g>
</svg>
