<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0c10"/>
      <stop offset="100%" style="stop-color:#111318"/>
    </linearGradient>
    <clipPath id="rc"><rect width="1200" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rc)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <rect width="1200" height="200" rx="14" fill="none" stroke="rgba(233,228,218,0.09)" stroke-width="1"/>

    <!-- Dividers -->
    <line x1="240" y1="24" x2="240" y2="176" stroke="rgba(233,228,218,0.07)" stroke-width="1"/>
    <line x1="480" y1="24" x2="480" y2="176" stroke="rgba(233,228,218,0.07)" stroke-width="1"/>
    <line x1="720" y1="24" x2="720" y2="176" stroke="rgba(233,228,218,0.07)" stroke-width="1"/>
    <line x1="960" y1="24" x2="960" y2="176" stroke="rgba(233,228,218,0.07)" stroke-width="1"/>

    <!-- Feature 1: Route Planning -->
    <g transform="translate(50, 40)">
      <circle cx="20" cy="20" r="20" fill="rgba(79,78,241,0.15)"/>
      <g stroke="#4f4ef1" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(8,8)">
        <circle cx="4" cy="16" r="3"/>
        <path d="M7 16h5.5a3 3 0 0 0 0-6h-9a3 3 0 0 1 0-6H12"/>
        <circle cx="20" cy="4" r="3"/>
      </g>
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#e9e4da">Route Planning</text>
      <text x="0" y="78" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">6 transport modes with</text>
      <text x="0" y="94" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">real OSRM geometry</text>
      <rect x="0" y="108" width="140" height="1" rx="0.5" fill="rgba(79,78,241,0.4)"/>
    </g>

    <!-- Feature 2: Pins -->
    <g transform="translate(290, 40)">
      <circle cx="20" cy="20" r="20" fill="rgba(244,63,94,0.12)"/>
      <g stroke="#f43f5e" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(8,8)">
        <path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z"/>
        <circle cx="12" cy="10" r="3"/>
      </g>
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#e9e4da">Custom Pins</text>
      <text x="0" y="78" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">Drop, drag and label</text>
      <text x="0" y="94" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">pins across the city</text>
      <rect x="0" y="108" width="140" height="1" rx="0.5" fill="rgba(244,63,94,0.4)"/>
    </g>

    <!-- Feature 3: Favorites -->
    <g transform="translate(530, 40)">
      <circle cx="20" cy="20" r="20" fill="rgba(245,158,11,0.12)"/>
      <g stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(8,8)">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </g>
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#e9e4da">Favorites</text>
      <text x="0" y="78" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">Save restaurants, cafes,</text>
      <text x="0" y="94" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">hotels and landmarks</text>
      <rect x="0" y="108" width="140" height="1" rx="0.5" fill="rgba(245,158,11,0.4)"/>
    </g>

    <!-- Feature 4: Notes -->
    <g transform="translate(770, 40)">
      <circle cx="20" cy="20" r="20" fill="rgba(139,92,246,0.12)"/>
      <g stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(8,8)">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </g>
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#e9e4da">Geo Notes</text>
      <text x="0" y="78" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">Attach notes to map</text>
      <text x="0" y="94" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">locations with coordinates</text>
      <rect x="0" y="108" width="140" height="1" rx="0.5" fill="rgba(139,92,246,0.4)"/>
    </g>

    <!-- Feature 5: Offline / Export -->
    <g transform="translate(1010, 40)">
      <circle cx="20" cy="20" r="20" fill="rgba(45,212,191,0.12)"/>
      <g stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(8,8)">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </g>
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#e9e4da">Data Export</text>
      <text x="0" y="78" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">JSON backup and restore</text>
      <text x="0" y="94" font-family="Space Grotesk, sans-serif" font-size="12" fill="#6d727b">with offline PWA cache</text>
      <rect x="0" y="108" width="140" height="1" rx="0.5" fill="rgba(45,212,191,0.4)"/>
    </g>
  </g>
</svg>
