    <text x="310" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#2dd4bf">ubuntu-latest · Node 20</text>

    <line x1="400" y1="55" x2="428" y2="55" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>

