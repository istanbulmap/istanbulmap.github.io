    <rect x="620" y="20" width="180" height="70" rx="10" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
    <text x="710" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b" letter-spacing="0.1em">04</text>
    <text x="710" y="68" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" fill="#e9e4da">upload-pages-artifact</text>
    <text x="710" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#a78bfa">dist/ → Pages</text>

    <line x1="800" y1="55" x2="828" y2="55" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>

