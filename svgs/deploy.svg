<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
  <defs>
    <clipPath id="rc"><rect width="1200" height="110" rx="12"/></clipPath>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <g clip-path="url(#rc)">
    <rect width="1200" height="110" fill="#050506"/>
    <rect width="1200" height="110" rx="12" fill="none" stroke="rgba(233,228,218,0.08)" stroke-width="1"/>

    <!-- Steps -->
    <!-- 1 -->
    <rect x="30" y="20" width="160" height="70" rx="10" fill="rgba(233,228,218,0.04)" stroke="rgba(233,228,218,0.12)" stroke-width="1"/>
    <text x="110" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b" letter-spacing="0.1em">01</text>
    <text x="110" y="68" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" fill="#e9e4da">git push main</text>
    <text x="110" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b">trigger CI</text>

    <line x1="190" y1="55" x2="218" y2="55" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 2 -->
    <rect x="220" y="20" width="180" height="70" rx="10" fill="rgba(45,212,191,0.07)" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
