    <rect x="430" y="20" width="160" height="70" rx="10" fill="rgba(79,78,241,0.08)" stroke="rgba(79,78,241,0.25)" stroke-width="1"/>
    <text x="510" y="48" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6d727b" letter-spacing="0.1em">03</text>
    <text x="510" y="68" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" fill="#e9e4da">npm ci &amp;&amp; build</text>
